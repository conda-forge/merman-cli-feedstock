context:
  version: "0.8.0"

package:
  name: merman-cli
  version: ${{ version }}

source:
  url: https://github.com/Latias94/merman/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 900fcb1c947e886ba501f5b5663f89455724fe16c3623fa5bb30b116bec7e33a

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
      # AWS-LC's Windows ARM64 assembly requires clang-cl, not cl.exe.
      CC_aarch64_pc_windows_msvc: clang-cl
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # build main app and generate license data
      - cd crates/merman-cli
      - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=../../THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - nushell
    - if: win and arm64
      then: clang

tests:
  - script:
      - merman-cli --help
      - merman-cli --version
  - package_contents:
      bin:
        - merman-cli
      strict: true

about:
  summary: Mermaid.js, but headless, in Rust. Parse, layout and render diagrams to SVG/PNG/JPG/PDF/ASCII/Unicode.
  description: |
    `merman-cli` is a performant browserless Mermaid command-line renderer in Rust for SVG, PNG, JPG, PDF, and
    ASCII/Unicode text output. The top-level command follows common `mmdc` workflows, while developer subcommands
    expose merman's parse, layout, and render internals.
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
    - THIRDPARTY.yml
  homepage: https://github.com/Latias94/merman
  repository: https://github.com/Latias94/merman

extra:
  recipe-maintainers:
    - Latias94
    - salim-b
