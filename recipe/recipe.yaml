context:
  version: "0.8.0"

package:
  name: merman-cli
  version: ${{ version }}

source:
  url: https://github.com/Latias94/merman/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 900fcb1c947e886ba501f5b5663f89455724fe16c3623fa5bb30b116bec7e33a

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
      # AWS-LC's Windows ARM64 assembly requires clang-cl, not cl.exe.
      CC_aarch64_pc_windows_msvc: clang-cl
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # build main app and generate license data
      - cd crates/merman-cli
      - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=../../THIRDPARTY.yml
      # copy shell completion files and man pages
      - mkdir ($prefix)/share/bash-completion/completions ($prefix)/share/fish/vendor_completions.d ($prefix)/share/zsh/site-functions ($prefix)/share/man/man1
      - cp assets/completions/merman-cli.bash ($prefix)/share/bash-completion/completions/merman-cli
      - cp assets/completions/merman-cli.fish ($prefix)/share/fish/vendor_completions.d/merman-cli.fish
      - cp assets/completions/_merman-cli     ($prefix)/share/zsh/site-functions/_merman-cli
      - cp assets/man/*.1                     ($prefix)/share/man/man1/

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - nushell
    - if: win and arm64
      then: clang

tests:
  - script:
      - merman-cli --help
      - merman-cli --version
  - package_contents:
      bin:
        - merman-cli
      files:
        - if: unix
          then:
            - share/bash-completion/completions/merman-cli
            - share/fish/vendor_completions.d/merman-cli.fish
            - share/zsh/site-functions/_merman-cli
            - share/man/man1/merman-cli*.1
        - if: win
          then:
            - Library/share/bash-completion/completions/merman-cli
            - Library/share/fish/vendor_completions.d/merman-cli.fish
            - Library/share/zsh/site-functions/_merman-cli
            - Library/share/man/man1/merman-cli*.1
      strict: true

about:
  summary: Mermaid.js, but headless, in Rust. Parse, layout and render diagrams to SVG/PNG/JPG/PDF/ASCII/Unicode.
  description: |
    `merman-cli` is a performant browserless Mermaid command-line renderer in Rust for SVG, PNG, JPG, PDF, and
    ASCII/Unicode text output. The top-level command follows common `mmdc` workflows, while developer subcommands
    expose merman's parse, layout, and render internals.
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
    - THIRDPARTY.yml
  homepage: https://github.com/Latias94/merman
  repository: https://github.com/Latias94/merman

extra:
  recipe-maintainers:
    - Latias94
    - salim-b
